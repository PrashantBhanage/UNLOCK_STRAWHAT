<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduBridge — Tutor Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">Edu<span>Bridge</span> · Tutor</div>
    <div class="topbar__actions">
      <div id="status-pill" class="status-pill">
        <span class="status-pill__dot"></span>
        <span class="status-pill__label">Online</span>
      </div>
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </div>
  </header>
  <div id="offline-banner" class="offline-banner">You're offline — reconnect to view and accept requests</div>

  <main class="page">
    <div class="page-header">
      <h1 id="user-greeting">Tutor Panel</h1>
      <p>Pending requests matching your subjects appear below.</p>
    </div>

    <div id="panel-alert" class="alert"></div>

    <div id="request-list" class="request-list"></div>

    <div id="empty-state" class="empty-state" style="display:none">
      <div class="empty-state__icon">📭</div>
      <h3>No pending requests</h3>
      <p>Check back later — students are studying!</p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/tutor-panel.js"></script>
</body>
</html>
